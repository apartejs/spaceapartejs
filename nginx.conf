# What serves the built site inside the image.
#
# A file rather than a `printf` inside the Dockerfile: nginx directives are full of `$`
# and `\`, every one of which has to survive a shell, and a config assembled by echo is
# a config nobody can read or change with confidence.

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Not routing — the configurator is one page. It is here so a typo in the path lands
  # on the app instead of nginx's own 404 page, and so any client-side route this
  # product grows later keeps working without a rebuild of this file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite fingerprints everything under /assets, so those names change whenever the bytes
  # do and can be cached hard. index.html must NOT be: it is the file that names the
  # current bundle, and a cached one would keep pointing at the previous deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # og.png and badge.svg keep their names across deploys, so they get a short cache
  # rather than an immutable one: long enough to matter, short enough that replacing the
  # share card does not need a new filename.
  location ~* \.(png|svg|ico|woff2)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}
